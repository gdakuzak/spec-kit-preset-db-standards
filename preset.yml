schema_version: "1.0"

preset:
  id: "db-standards"
  name: "Database Standards"
  version: "0.8.2"
  description: "Database conventions for spec-driven work: naming, data-model design, constraints, data protection, performance, query safety, a schema-review checklist, and engine-specific references. ORM-agnostic."
  author: "Guilherme Dakuzaku"
  repository: "https://github.com/gdakuzak/spec-kit-preset-db-standards"
  license: "MIT"

requires:
  speckit_version: ">=0.1.0"

provides:
  templates:
    - type: "command"
      name: "speckit.constitution"
      file: "commands/speckit.constitution.md"
      description: "Require confirming the target database before drafting the constitution"
      strategy: "append"

    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-addendum.md"
      description: "Database section (engine, version, migration tool) in the constitution"
      strategy: "append"

    - type: "template"
      name: "spec-template"
      file: "templates/spec-addendum.md"
      description: "Data requirements section for the feature spec"
      strategy: "append"

    - type: "template"
      name: "plan-template"
      file: "templates/plan-addendum.md"
      description: "Data-model design, naming conventions, and performance rules (indexes, N+1)"
      strategy: "append"

    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-addendum.md"
      description: "Schema-review checklist to run before merging a migration"
      strategy: "append"

tags:
  - "database"
  - "standards"
  - "data-modeling"
  - "performance"
